<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Profile Finder</title>

   <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 650px;
    text-align: center;
}

h1 {
    color: white;
    font-size: 35px;
    margin-bottom: 10px;
}

.subtitle {
    color: #eee;
    margin-bottom: 25px;
}

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

#searchInput {
    flex: 1;
    padding: 15px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

#searchBtn {
    padding: 15px 25px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

#searchBtn:hover {
    background: #444;
}

.profile-card {
    background: white;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.profile-card img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 15px;
}

.profile-card h2 {
    font-size: 26px;
    margin-bottom: 5px;
}

.username {
    color: #666;
    margin-bottom: 15px;
}

.bio {
    color: #444;
    margin-bottom: 25px;
}

.stats {
    display: flex;
    justify-content: space-around;
    margin-bottom: 25px;
}

.stat {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.stat strong {
    font-size: 20px;
}

.stat span {
    color: #666;
    font-size: 14px;
}

.profile-link {
    display: inline-block;
    text-decoration: none;
    background: #24292f;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
}

.profile-link:hover {
    background: #444;
}

.error {
    background: white;
    color: red;
    padding: 20px;
    border-radius: 10px;
    font-size: 18px;
}

.loading {
    color: white;
    font-size: 18px;
}

@media (max-width: 500px) {

    .search-box {
        flex-direction: column;
    }

    .stats {
        gap: 15px;
    }

    h1 {
        font-size: 28px;
    }
}
   </style>
</head>

<body>

    <div class="container">

        <h1>GitHub Profile Finder 🔎</h1>

        <p class="subtitle">
            Search any GitHub username
        </p>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Enter GitHub username..."
            >

            <button id="searchBtn">
                Search
            </button>

        </div>

        <div id="result"></div>

    </div>

    <script>
const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const result = document.getElementById("result");

async function getUser(username) {

    try {

        result.innerHTML = `
            <p class="loading">Loading... ⏳</p>
        `;

        const response = await fetch(
            `https://api.github.com/users/${username}`
        );

        if (!response.ok) {
            throw new Error("User not found");
        }

        const data = await response.json();

        result.innerHTML = `

            <div class="profile-card">

                <img
                    src="${data.avatar_url}"
                    alt="${data.login}"
                >

                <h2>
                    ${data.name || data.login}
                </h2>

                <p class="username">
                    @${data.login}
                </p>

                <p class="bio">
                    ${data.bio || "No bio available"}
                </p>


                <div class="stats">

                    <div class="stat">
                        <strong>
                            ${data.followers}
                        </strong>

                        <span>
                            Followers
                        </span>
                    </div>


                    <div class="stat">
                        <strong>
                            ${data.following}
                        </strong>

                        <span>
                            Following
                        </span>
                    </div>


                    <div class="stat">
                        <strong>
                            ${data.public_repos}
                        </strong>

                        <span>
                            Repositories
                        </span>
                    </div>

                </div>


                <a
                    href="${data.html_url}"
                    target="_blank"
                    class="profile-link"
                >
                    View GitHub Profile
                </a>

            </div>
        `;

    } catch (error) {

        result.innerHTML = `
            <p class="error">
                User not found ❌
            </p>
        `;

    }
}



// Search button
searchBtn.addEventListener("click", function () {

    const username = searchInput.value.trim();


    if (username === "") {

        result.innerHTML = `
            <p class="error">
                Please enter a username ⚠️
            </p>
        `;

        return;
    }


    getUser(username);

});

searchInput.addEventListener("keydown", function (event) {

    if (event.key === "Enter") {

        searchBtn.click();

    }

});

let timer;

searchInput.addEventListener("input", function () {

    clearTimeout(timer);

    const username = searchInput.value.trim();

    // Agar search box empty hai
    if (username === "") {
        result.innerHTML = "";
        return;
    }

    timer = setTimeout(() => {

        getUser(username);

    }, 500);

});
    </script>

</body>

</html>
