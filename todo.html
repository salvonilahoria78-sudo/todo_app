<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo app</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        #app {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #272626;
        }

        #new-todo {
            width: 70%;
            padding: 10px;
            box-sizing: border-box;
        }

        #add-todo {
            padding: 10px 15px;
            cursor: pointer;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            padding: 10px;
            margin-top: 10px;
            background-color: #eeeeee;
            border-radius: 5px;
        }

        li button {
            float: right;
            margin-left: 5px;
            cursor: pointer;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        #task-counter {
            font-weight: bold;
        }

        .filter-buttons {
            margin-top: 10px;
            text-align: center;

        }
    </style>
</head>

<body>
    <div id="app">
        <h1>Todo App</h1>
        <input type="text" id="new-todo" placeholder="Add a new todo">

        <button id="add-todo">Add</button>
        <div class="filter-buttons">
            <button id="all-btn">All</button>
            <button id="active-btn">Active</button>
            <button id="completed-btn">Completed</button>
        </div>

        <p>Pending Tasks: <span id="task-counter">0</span></p>
        <ul id="todo-list"></ul>
        <div class="filter-buttons">
            <button id="clear-completed">Clear Completed</button>
        </div>

    </div>

    <script>
        const input = document.getElementById("new-todo");
        const addButton = document.getElementById("add-todo");
        const todoList = document.getElementById("todo-list");
        const allButton = document.getElementById("all-btn");
        const activeButton = document.getElementById("active-btn");
        const completedButton = document.getElementById("completed-btn");
        const clearCompletedButton = document.getElementById("clear-completed");
        let todos = JSON.parse(localStorage.getItem("todos")) || [];


        let currentFilter = "all"; // Default filter


        function saveTodos() {
            localStorage.setItem("todos", JSON.stringify(todos));
        }

        function updateCounter() {
            const counter = document.getElementById("task-counter");

            const pendingTasks = todos.filter(function (todo) {
                return !todo.completed;
            });

            counter.textContent = pendingTasks.length;
        }


        function showTodos() {
            todoList.innerHTML = "";
            let filteredTodos = todos;
            if (currentFilter === "active") {
                filteredTodos = todos.filter(function (todo) {
                    return !todo.completed;
                });
            }
            if (currentFilter === "completed") {
                filteredTodos = todos.filter(function (todo) {
                    return todo.completed;
                });
            }

            filteredTodos.forEach(function (todo) {
                const li = document.createElement("li");
                li.textContent = todo.text;
                if (todo.completed) {
                    li.classList.add("completed");
                }
                li.addEventListener("click", function () {
                    todo.completed = !todo.completed;
                    li.classList.toggle("completed");
                    saveTodos();
                    updateCounter();
                });

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "🗑️";
                li.appendChild(deleteButton);

                const editButton = document.createElement("button");
                editButton.textContent = "✏️";
                li.appendChild(editButton);

                editButton.addEventListener("click", function (event) {
                    event.stopPropagation();
                    const newTask = prompt("Edit your task:", todo.text);
                    if (newTask === null || newTask.trim() === "") {
                        return;
                    }
                    todo.text = newTask;
                    li.firstChild.textContent = newTask;
                    saveTodos();

                });

                deleteButton.addEventListener("click", function (event) {
                    event.stopPropagation();
                    todoList.removeChild(li);
                    todos = todos.filter(t => t !== todo);
                    saveTodos();
                    updateCounter();
                });

                todoList.appendChild(li);
            });
        }
        showTodos();
        updateCounter();
        addButton.addEventListener("click", function () {
            const task = input.value;
            if (task.trim() === "") {
                return;
            }
            const todo = {
                text: task,
                completed: false

            };
            todos.push(todo);
            saveTodos();
            const li = document.createElement("li");
            li.textContent = task;
            li.addEventListener("click", function () {
                todo.completed = !todo.completed;
                li.classList.toggle("completed");
                saveTodos();
                updateCounter();
            });
            const deleteButton = document.createElement("button");
            deleteButton.textContent = "🗑️";
            li.appendChild(deleteButton);
            const editButton = document.createElement("button");
            editButton.textContent = "✏️";
            li.appendChild(editButton);

            editButton.addEventListener("click", function (event) {
                event.stopPropagation();

                const newTask = prompt("Edit your task:", todo.text);

                if (newTask === null || newTask.trim() === "") {
                    return;
                }

                todo.text = newTask;
                li.firstChild.textContent = newTask;

                saveTodos();
            });
            deleteButton.addEventListener("click", function (event) {
                event.stopPropagation();
                todoList.removeChild(li);
                todos = todos.filter(t => t !== todo);
                saveTodos();
                updateCounter();
            });
            todoList.appendChild(li);
            updateCounter();
            input.value = "";

        });
        allButton.addEventListener("click", function () {
            currentFilter = "all";
            showTodos();
        });

        activeButton.addEventListener("click", function () {
            currentFilter = "active";
            showTodos();
        });

        completedButton.addEventListener("click", function () {
            currentFilter = "completed";
            showTodos();
        });
        clearCompletedButton.addEventListener("click", function () {
            todos = todos.filter(function (todo) {
                return !todo.completed;
            });
            saveTodos();
            showTodos();
            updateCounter();
        });

    </script>

</body>

</html>
