<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo app</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        #app {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #272626;
        }

        #new-todo {
            width: 70%;
            padding: 10px;
            box-sizing: border-box;
        }

        #add-todo {
            padding: 10px 15px;
            cursor: pointer;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            padding: 10px;
            margin-top: 10px;
            background-color: #eeeeee;
            border-radius: 5px;
        }

        li button {
            float: right;
            margin-left: 5px;
            cursor: pointer;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        #task-counter {
            font-weight: bold;
        }

        .filter-buttons {
            margin-top: 10px;
            text-align: center;

        }

        #error-message {
            color: red;
            text-align: center;
        }

        #todo-controls {
            display: none;
        }

        /* All button */
        #all-btn {
            background-color: #c7d2fe;
            color: #3730a3;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Active button */
        #active-btn {
            background-color: #bbf7d0;
            color: #166534;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Completed button */
        #completed-btn {
            background-color: #fde68a;
            color: #92400e;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Clear Completed */
        #clear-completed {
            background-color: #fecaca;
            color: #991b1b;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Selected filter */
        #all-btn.selected {
            background-color: #4f46e5;
            color: white;
        }

        #active-btn.selected {
            background-color: #16a34a;
            color: white;
        }

        #completed-btn.selected {
            background-color: #f59e0b;
            color: white;
        }

        /* Hover */
        #all-btn:hover {
            background-color: #4f46e5;
            color: white;
        }

        #active-btn:hover {
            background-color: #16a34a;
            color: white;
        }

        #completed-btn:hover {
            background-color: #f59e0b;
            color: white;
        }

        #clear-completed:hover {
            background-color: #dc2626;
            color: white;
        }
    </style>
</head>

<body>
    <div id="app">
        <h1>Todo App</h1>
        <input type="text" id="new-todo" placeholder="Add a new todo">
        <button id="add-todo">Add</button>

        <p id="error-message"></p>

        <div id="todo-controls">
            <div class="filter-buttons">
                <button id="all-btn">All</button>
                <button id="active-btn">Active</button>
                <button id="completed-btn">Completed</button>
            </div>

            <p>Pending Tasks: <span id="task-counter">0</span></p>
            <ul id="todo-list"></ul>
            <div class="filter-buttons">
                <button id="clear-completed">Clear Completed</button>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById("new-todo");
        const addButton = document.getElementById("add-todo");
        const todoList = document.getElementById("todo-list");
        const allButton = document.getElementById("all-btn");
        const activeButton = document.getElementById("active-btn");
        const completedButton = document.getElementById("completed-btn");
        const clearCompletedButton = document.getElementById("clear-completed");
        const errormessage = document.getElementById("error-message");
        const todoControls = document.getElementById("todo-controls");
        let todos = JSON.parse(localStorage.getItem("todos")) || [];


        let currentFilter = "all"; // Default filter


        function saveTodos() {
            localStorage.setItem("todos", JSON.stringify(todos));
        }
        function updateControls() {
            if (todos.length === 0) {
                todoControls.style.display = "none";
            } else {
                todoControls.style.display = "block";
            }
        }
        function updateFilterButtons() {
            allButton.classList.remove("selected");
            activeButton.classList.remove("selected");
            completedButton.classList.remove("selected");

            if (currentFilter === "all") {
                allButton.classList.add("selected");
            }

            if (currentFilter === "active") {
                activeButton.classList.add("selected");
            }

            if (currentFilter === "completed") {
                completedButton.classList.add("selected");
            }
        }

        function updateCounter() {
            const counter = document.getElementById("task-counter");

            const pendingTasks = todos.filter(function (todo) {
                return !todo.completed;
            });

            counter.textContent = pendingTasks.length;
        }


        function showTodos() {
            todoList.innerHTML = "";
            let filteredTodos = todos;
            if (currentFilter === "active") {
                filteredTodos = todos.filter(function (todo) {
                    return !todo.completed;
                });
            }
            if (currentFilter === "completed") {
                filteredTodos = todos.filter(function (todo) {
                    return todo.completed;
                });
            }
      

            if (filteredTodos.length === 0) {
                const message = document.createElement("p");

                if (currentFilter === "active") {
                    message.textContent = "🎉 All tasks are completed!";
                }

                else if (currentFilter === "completed") {
                    message.textContent = "No completed tasks yet.";
                }

                message.style.textAlign = "center";
                message.style.color = "gray";
                message.style.fontWeight = "bold";

                todoList.appendChild(message);
                return;
            }

            filteredTodos.forEach(function (todo) {
                const li = document.createElement("li");
                li.textContent = todo.text;
                if (todo.completed) {
                    li.classList.add("completed");
                }
                li.addEventListener("click", function () {
                    todo.completed = !todo.completed;
                    li.classList.toggle("completed");
                    saveTodos();
                    updateCounter();
                });

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "🗑️";
                li.appendChild(deleteButton);

                const editButton = document.createElement("button");
                editButton.textContent = "✏️";
                li.appendChild(editButton);

                editButton.addEventListener("click", function (event) {
                    event.stopPropagation();

                    let newTask = prompt("Edit your task:", todo.text);
                    if (newTask === null) {
                        return;
                    }
                    while (newTask.trim() === "") {
                        newTask = prompt("Please enter a value!",);

                        if (newTask === null) {
                            return;
                        }
                    }
                    todo.text = newTask;
                    li.firstChild.textContent = newTask;
                    saveTodos();

                });

                deleteButton.addEventListener("click", function (event) {
                    event.stopPropagation();
                    todoList.removeChild(li);
                    todos = todos.filter(t => t !== todo);
                    saveTodos();
                    updateCounter();
                    updateFilterButtons();
                });

                todoList.appendChild(li);
            });
        }
        showTodos();
        updateCounter();
        updateControls();

        addButton.addEventListener("click", function () {
            const task = input.value;
            if (task.trim() === "") {
                errormessage.textContent = "Please enter a task first!";
                return;
            }
            errormessage.textContent = "";
            const todo = {
                text: task,
                completed: false

            };

            todos.push(todo);
            saveTodos();
            updateControls();

            const li = document.createElement("li");
            li.textContent = task;
            li.addEventListener("click", function () {
                todo.completed = !todo.completed;
                li.classList.toggle("completed");
                saveTodos();
                updateCounter();
                updateControls();
            });
            const deleteButton = document.createElement("button");
            deleteButton.textContent = "🗑️";
            li.appendChild(deleteButton);
            const editButton = document.createElement("button");
            editButton.textContent = "✏️";
            li.appendChild(editButton);

            editButton.addEventListener("click", function (event) {
                event.stopPropagation();

                const newTask = prompt("Edit your task:", todo.text);

                if (newTask === null || newTask.trim() === "") {

                    return;
                }

                todo.text = newTask;
                li.firstChild.textContent = newTask;

                saveTodos();
            });
            deleteButton.addEventListener("click", function (event) {
                event.stopPropagation();
                todoList.removeChild(li);
                todos = todos.filter(t => t !== todo);
                saveTodos();
                updateCounter();
                updateControls();
            });
            todoList.appendChild(li);
            updateCounter();
            input.value = "";

        });
      allButton.addEventListener("click", function () {
                currentFilter = "all";
                showTodos();
                updateFilterButtons();
            });

            activeButton.addEventListener("click", function () {
                currentFilter = "active";
                showTodos();
                updateFilterButtons();
            });

            completedButton.addEventListener("click", function () {
                currentFilter = "completed";
                showTodos();
                updateFilterButtons();
            });
            saveTodos();
            showTodos();
            updateCounter();
            updateControls();
       

    </script>

</body>

</html>
