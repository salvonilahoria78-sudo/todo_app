<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Meme Generator</title>

    <style>
        .skeleton {
    width: 100%;
    height: 400px;
    margin: 20px 0;
    border-radius: 8px;
    background: linear-gradient(
        90deg,
        #eeeeee 25%,
        #dddddd 50%,
        #eeeeee 75%
    );
    background-size: 200% 100%;
    animation: loading 1.5s infinite;
}

@keyframes loading {
    0% {
        background-position: 200% 0;
    }

    100% {
        background-position: -200% 0;
    }
}
#memeImage {
    display: none;
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    margin: 20px 0;
}
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding: 40px;
        }

        .container {
            width: 500px;
            max-width: 90%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #memeImage {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            margin: 20px 0;
        }

        button {
            padding: 12px 20px;
            background: black;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #333;
        }

        #loading {
            display: none;
        }

        #error {
            color: red;
        }
        .title-skeleton {
    width: 70%;
    height: 25px;
    margin: 20px auto;
    border-radius: 6px;

    background: linear-gradient(
        90deg,
        #eeeeee 25%,
        #dddddd 50%,
        #eeeeee 75%
    );

    background-size: 200% 100%;
    animation: loading 1.5s infinite;
}
#title{
    display :none;
}
    </style>
</head>

<body>

    <div class="container">

        <h1>Random Meme Generator 😂</h1>

        

        <p id="error"></p>

       
      
        <div id="title-skeleton" class="title-skeleton"></div>
         <h2 id="title"></h2>
           <div id="skeleton" class="skeleton"></div>

        <img id="memeImage" src="" alt="Meme">

        <br>

        <button onclick="getMeme()">
            Generate New Meme 🎲
        </button>

    </div>


    <script>

       
        let title = document.getElementById("title");
        let memeImage = document.getElementById("memeImage");
       
        let error = document.getElementById("error");
        let skeleton = document.getElementById("skeleton");
        let titleSkeleton = document.getElementById("title-skeleton");


       
        async function getMeme() {
            skeleton.style.display = "block";
            titleSkeleton.style.display = "block";
            memeImage.style.display = "none";
            title.innerText = "";

            title.style.display = "none";
            error.innerText = "";

            try {

            
                let response = await fetch("https://meme-api.com/gimme");

                
                let data = await response.json();

                console.log(data);

               
                title.innerText = data.title;

              
                memeImage.src = data.url;

              memeImage.onload = () => {
                    skeleton.style.display = "none";
                    memeImage.style.display = "block";
                };
            }

            catch (err) {

                error.innerText = "Meme load nahi hua 😢";

                console.log(err);
                skeleton.style.display = "none";

            }

            finally {

                titleSkeleton.style.display = "none";

            }
        }


       
        getMeme();

    </script>

</body>

</html>
